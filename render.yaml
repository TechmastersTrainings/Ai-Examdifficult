services:
  # ==============================================================================
  # Render Web Service: FastAPI Backend
  # ==============================================================================
  - type: web
    name: ai-exam-analyzer-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    region: oregon
    healthCheckPath: /api/v1/health
    envVars:
      - key: PROJECT_NAME
        value: "AI BASED AUTOMATIC QUESTION PAPER DIFFICULTY ANALYZER"
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 60
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: 7
      - key: DATABASE_URL
        fromDatabase:
          name: ai-exam-analyzer-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "http://localhost:3000,https://*.vercel.app"
      - key: UPLOAD_DIR
        value: /tmp/uploads
      - key: REPORTS_DIR
        value: /tmp/reports

databases:
  # ==============================================================================
  # Render Managed Database: PostgreSQL 16
  # ==============================================================================
  - name: ai-exam-analyzer-db
    databaseName: ai_exam_difficult
    user: postgres
    plan: free
    region: oregon
